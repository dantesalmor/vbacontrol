<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kit VBA para el Control 2</title>
<style>
/* Kit VBA: la interfaz toma prestados dos elementos de Excel que ya conocés:
   la barra de fórmulas (cuadro de nombre + fx = buscador) y la cuadrícula
   (el adaptador se llena como celdas). Los colores de línea tienen significado:
   amarillo = depende del adaptador, rojo = trampa. */

:root {
  color-scheme: light;
  --bg: #F3F6F5;
  --hoja: #FFFFFF;
  --hundido: #EAF0EE;
  --tinta: #16201C;
  --tinta2: #46544E;
  --tenue: #75837D;
  --linea: #D7E0DC;
  --linea2: #C3CFCA;
  --verde: #1C6B44;
  --verde-suave: #E1F0E7;
  --verde-medio: #B9DCC7;
  --cambiar: #FFF6C9;
  --cambiar-borde: #E3C200;
  --cambiar-tinta: #6E5600;
  --trampa: #FDE8E5;
  --trampa-borde: #D2473A;
  --trampa-tinta: #96281D;
  --antes: #FBEAEA;
  --despues: #E5F4EA;
  --cod-bg: #FBFCFB;
  --cod-num: #A5B2AC;
  --k: #1D3FA6;
  --c: #2F7A39;
  --s: #8A3F12;
  --n: #0B6970;
  --f: #6A2F8F;
  --sombra: 0 1px 0 rgba(20, 40, 30, .04), 0 8px 24px -18px rgba(20, 40, 30, .35);
  --f-texto: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --f-cod: "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, ui-monospace, monospace;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0F1513; --hoja: #161E1B; --hundido: #1C2622; --tinta: #E3EBE7; --tinta2: #B2C0B9; --tenue: #84948C;
    --linea: #28332F; --linea2: #34423C; --verde: #5CC08A; --verde-suave: #18342A; --verde-medio: #24513D;
    --cambiar: #3D3510; --cambiar-borde: #C9A80E; --cambiar-tinta: #F2D864;
    --trampa: #3E1C19; --trampa-borde: #E4685B; --trampa-tinta: #F5A79E;
    --antes: #321C1C; --despues: #16301F; --cod-bg: #121916; --cod-num: #4E5E57;
    --k: #8FB2FF; --c: #7FC88B; --s: #E8A774; --n: #6DD3D9; --f: #D2A8F2;
    --sombra: 0 1px 0 rgba(0,0,0,.3), 0 10px 26px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0F1513; --hoja: #161E1B; --hundido: #1C2622; --tinta: #E3EBE7; --tinta2: #B2C0B9; --tenue: #84948C;
  --linea: #28332F; --linea2: #34423C; --verde: #5CC08A; --verde-suave: #18342A; --verde-medio: #24513D;
  --cambiar: #3D3510; --cambiar-borde: #C9A80E; --cambiar-tinta: #F2D864;
  --trampa: #3E1C19; --trampa-borde: #E4685B; --trampa-tinta: #F5A79E;
  --antes: #321C1C; --despues: #16301F; --cod-bg: #121916; --cod-num: #4E5E57;
  --k: #8FB2FF; --c: #7FC88B; --s: #E8A774; --n: #6DD3D9; --f: #D2A8F2;
  --sombra: 0 1px 0 rgba(0,0,0,.3), 0 10px 26px -18px rgba(0,0,0,.8);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 120px); background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--tinta); font: 15px/1.55 var(--f-texto); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--verde); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; }
code, kbd { font-family: var(--f-cod); font-size: .92em; }
kbd { border: 1px solid var(--linea2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--hoja); }

/* ---------- Cabecera: barra de fórmulas ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--hoja); border-bottom: 1px solid var(--linea); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 41; background: var(--hoja); }
.barra { display: flex; align-items: center; gap: 16px; padding: 10px max(16px, env(safe-area-inset-left, 0px)) 8px max(16px, env(safe-area-inset-right, 0px)); }
.marca { display: flex; align-items: center; gap: 10px; flex: none; }
.marca b { display: block; font-size: 16px; letter-spacing: -.01em; }
.marca small { display: block; color: var(--tenue); font-size: 12px; line-height: 1.2; }
.logo { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 7px; background: var(--verde); color: #fff; font: italic 600 15px/1 Georgia, "Times New Roman", serif; }
:root[data-theme="dark"] .logo { color: #0F1513; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo { color: #0F1513; } }

.formula { position: relative; flex: 1; display: flex; align-items: stretch; min-width: 0; height: 36px; border: 1px solid var(--linea2); border-radius: 6px; background: var(--hoja); }
.formula:focus-within { border-color: var(--verde); box-shadow: 0 0 0 3px var(--verde-suave); }
.nombre { display: grid; place-items: center; min-width: 54px; padding: 0 10px; border-right: 1px solid var(--linea2); font: 600 13px var(--f-cod); color: var(--tinta2); background: var(--hundido); border-radius: 5px 0 0 5px; }
.fx { display: grid; place-items: center; padding: 0 10px; border-right: 1px solid var(--linea); color: var(--tenue); font: italic 14px Georgia, serif; cursor: text; }
.fx::before { content: "fx"; }
.fx { font-size: 0; } .fx::before { font-size: 14px; }
.formula input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 0 12px; outline: none; font-family: var(--f-cod); font-size: 13.5px; }
.formula input::placeholder { color: var(--tenue); font-family: var(--f-texto); }
.resultados { position: absolute; left: 0; right: 0; top: calc(100% + 6px); max-height: min(60vh, 460px); overflow: auto; background: var(--hoja); border: 1px solid var(--linea2); border-radius: 8px; box-shadow: var(--sombra); padding: 6px; z-index: 50; }
.res-grupo { padding: 8px 10px 4px; color: var(--tenue); font-size: 12px; font-weight: 600; }
.res { display: flex; gap: 12px; align-items: baseline; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 6px; }
.res b { font-family: var(--f-cod); font-weight: 600; font-size: 13px; white-space: nowrap; }
.res span { color: var(--tinta2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res.sel, .res:hover { background: var(--verde-suave); }
.res-vacio { padding: 14px 10px; color: var(--tinta2); font-size: 14px; }

.icono { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--linea2); border-radius: 6px; background: var(--hoja); color: var(--tinta2); }
.icono:hover { color: var(--tinta); border-color: var(--tenue); }

.pestanas { display: flex; gap: 2px; padding: 0 max(12px, env(safe-area-inset-left, 0px)); overflow-x: auto; scrollbar-width: none; }
.pes { flex: none; border: 0; background: none; padding: 8px 14px 9px; font-size: 14px; color: var(--tinta2); border-bottom: 3px solid transparent; }
.pes.activa { color: var(--verde); border-bottom-color: var(--verde); font-weight: 600; }
.pes:disabled { color: var(--tenue); opacity: .65; cursor: default; }

/* ---------- Marco de tres columnas ---------- */
.marco { display: grid; grid-template-columns: 210px minmax(0, 1fr) 360px; gap: 0; max-width: 1600px; margin: 0 auto; }
.nav { position: sticky; top: var(--alto, 118px); align-self: start; max-height: calc(100vh - var(--alto, 118px)); overflow: auto; padding: 20px 10px 40px 16px; }
.contenido { min-width: 0; padding: 22px 26px 120px; }
.panel { position: sticky; top: var(--alto, 118px); align-self: start; height: calc(100vh - var(--alto, 118px)); border-left: 1px solid var(--linea); background: var(--hoja); }
.panel-in { height: 100%; overflow: auto; padding: 20px 20px 60px; }

/* Navegación de problemas */
.nav-p { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 7px; color: var(--tinta); }
.nav-p .id { display: inline-block; min-width: 28px; font: 600 12px var(--f-cod); color: var(--tenue); }
.nav-p.activo { background: var(--verde-suave); }
.nav-p.activo .id { color: var(--verde); }
.nav-p:hover:not(.activo) { background: var(--hundido); }
.nav-m { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 3px 10px 3px 38px; font: 12.5px var(--f-cod); color: var(--tinta2); border-radius: 5px; overflow: hidden; text-overflow: ellipsis; }
.nav-m:hover { color: var(--verde); background: var(--hundido); }
.nav-sep { height: 10px; }
.nav-ayuda { margin: 18px 10px 0; padding-top: 14px; border-top: 1px solid var(--linea); color: var(--tenue); font-size: 12.5px; line-height: 1.5; }
.nav-ayuda p { margin: 0 0 8px; }

/* ---------- Contenido del problema ---------- */
.cabeza { max-width: 920px; margin-bottom: 22px; }
.cabeza h1 { font-size: 28px; letter-spacing: -.02em; font-weight: 650; }
.cabeza h1 .id { font: 600 15px var(--f-cod); color: var(--verde); vertical-align: 5px; margin-right: 10px; }
.cabeza p { margin: 8px 0 0; color: var(--tinta2); max-width: 72ch; }
.nota { margin: 12px 0 0; padding: 10px 14px; border-left: 3px solid var(--verde); background: var(--verde-suave); border-radius: 0 6px 6px 0; font-size: 14px; color: var(--tinta); max-width: 78ch; }

.bloque { margin: 0 0 28px; }
.bloque > h2 { font-size: 17px; font-weight: 650; margin-bottom: 10px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.bloque > h2 small { font-size: 13px; font-weight: 400; color: var(--tenue); }

.pide { list-style: none; margin: 0; padding: 0; border: 1px solid var(--linea); border-radius: 8px; background: var(--hoja); overflow: hidden; }
.pide li { display: grid; grid-template-columns: minmax(170px, 230px) 1fr; gap: 14px; padding: 10px 14px; border-top: 1px solid var(--linea); }
.pide li:first-child { border-top: 0; }
.pide .mac { font: 600 13px var(--f-cod); color: var(--verde); border: 0; background: none; padding: 0; text-align: left; justify-self: start; }
.pide .mac:hover { text-decoration: underline; }
.pide span { color: var(--tinta2); font-size: 14px; }

/* Adaptador: cuadrícula tipo hoja */
.adapt { border: 1px solid var(--linea2); border-radius: 8px; background: var(--hoja); overflow: hidden; }
.adapt-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 10px 14px; background: var(--hundido); border-bottom: 1px solid var(--linea2); }
.adapt-cab p { margin: 0; font-size: 13.5px; color: var(--tinta2); max-width: 70ch; }
.grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.grupo { border-right: 1px solid var(--linea); border-bottom: 1px solid var(--linea); }
.grupo h3 { font-size: 12.5px; font-weight: 600; color: var(--tenue); padding: 7px 12px; background: var(--cod-bg); border-bottom: 1px solid var(--linea); }
.celda { display: grid; grid-template-columns: 1fr 108px; align-items: stretch; border-top: 1px solid var(--linea); }
.celda:first-of-type { border-top: 0; }
.celda label { padding: 6px 12px; font-size: 13.5px; color: var(--tinta2); align-self: center; }
.celda .val { position: relative; display: flex; border-left: 1px solid var(--linea); }
.celda input { width: 100%; min-width: 0; border: 0; background: transparent; padding: 6px 10px; font: 13.5px var(--f-cod); color: var(--tinta); outline: none; }
.celda input:focus { background: var(--cambiar); box-shadow: inset 0 0 0 2px var(--verde); }
.celda.cambio input { color: var(--verde); font-weight: 600; }
.celda .eq { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: 11.5px var(--f-cod); color: var(--tenue); pointer-events: none; }
.celda.ancha { grid-template-columns: 1fr 150px; }

/* Barra de herramientas del código */
.herr { position: sticky; top: var(--alto, 118px); z-index: 20; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 0; background: var(--bg); }
.seg { display: inline-flex; border: 1px solid var(--linea2); border-radius: 7px; overflow: hidden; background: var(--hoja); }
.seg button { border: 0; background: none; padding: 6px 12px; font-size: 13.5px; color: var(--tinta2); border-left: 1px solid var(--linea); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--verde); color: #fff; }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { color: #0F1513; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { color: #0F1513; } }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--linea2); background: var(--hoja); border-radius: 7px; padding: 6px 12px; font-size: 13.5px; color: var(--tinta); }
.btn:hover { border-color: var(--tenue); }
.btn.prim { background: var(--verde); border-color: var(--verde); color: #fff; }
:root[data-theme="dark"] .btn.prim { color: #0F1513; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.prim { color: #0F1513; } }
.leyenda { display: flex; gap: 14px; flex-wrap: wrap; margin-left: auto; font-size: 12.5px; color: var(--tinta2); }
.leyenda i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
.leyenda .lc { background: var(--cambiar); border-left: 3px solid var(--cambiar-borde); }
.leyenda .lt { background: var(--trampa); border-left: 3px solid var(--trampa-borde); }
.leyenda .lf { border-bottom: 2px dotted var(--f); border-radius: 0; width: 18px; height: 8px; }

/* Tarjeta de macro y bloque de código */
.macro { margin: 0 0 20px; border: 1px solid var(--linea); border-radius: 8px; background: var(--hoja); box-shadow: var(--sombra); overflow: hidden; scroll-margin-top: 175px; }
.macro-cab { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--linea); }
.macro-cab h3 { font: 600 15px var(--f-cod); color: var(--tinta); }
.macro-cab p { margin: 0; color: var(--tenue); font-size: 13.5px; flex: 1; min-width: 0; }
.cod { margin: 0; padding: 8px 0 10px; background: var(--cod-bg); overflow-x: auto; font: 13.5px/1.6 var(--f-cod); tab-size: 4; counter-reset: ln; }
.ln { display: flex; min-width: max-content; padding-right: 18px; border-left: 3px solid transparent; }
.ln::before { counter-increment: ln; content: counter(ln); flex: none; width: 44px; padding-right: 14px; text-align: right; color: var(--cod-num); user-select: none; }
.ln .t { white-space: pre; }
.ln.cambiar { background: var(--cambiar); border-left-color: var(--cambiar-borde); cursor: help; }
.ln.trampa { background: var(--trampa); border-left-color: var(--trampa-borde); cursor: help; }
.ln.sel { outline: 2px solid var(--verde); outline-offset: -2px; }
.cod .k { color: var(--k); }
.cod .c { color: var(--c); font-style: italic; }
.cod .s { color: var(--s); }
.cod .n { color: var(--n); }
.tok { border: 0; padding: 0; margin: 0; background: none; font: inherit; line-height: inherit; color: var(--f); border-bottom: 1px dotted currentColor; border-radius: 0; cursor: pointer; }
.tok.k { color: var(--k); border-bottom-color: transparent; }
.tok:hover, .tok.activo { background: var(--verde-medio); color: var(--tinta); }

/* Comprobar */
.check { list-style: none; margin: 0; padding: 0; border: 1px solid var(--linea); border-radius: 8px; background: var(--hoja); }
.check li { border-top: 1px solid var(--linea); }
.check li:first-child { border-top: 0; }
.check label { display: flex; gap: 12px; align-items: flex-start; padding: 9px 14px; font-size: 14px; cursor: pointer; }
.check input { margin-top: 4px; accent-color: var(--verde); width: 16px; height: 16px; flex: none; }
.check input:checked + span { color: var(--tenue); text-decoration: line-through; text-decoration-color: var(--linea2); }

/* Variantes */
.var { border: 1px solid var(--linea); border-radius: 8px; background: var(--hoja); margin-bottom: 8px; scroll-margin-top: 175px; }
.var summary { cursor: pointer; padding: 10px 14px; display: flex; gap: 10px; align-items: baseline; list-style: none; }
.var summary::-webkit-details-marker { display: none; }
.var summary::before { content: "+"; font: 600 15px var(--f-cod); color: var(--verde); width: 12px; flex: none; }
.var[open] summary::before { content: "−"; }
.var summary b { font-weight: 600; font-size: 14.5px; }
.var summary span { color: var(--tenue); font-size: 13.5px; }
.var-cuerpo { padding: 0 14px 14px; }
.diff { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.diff figure { margin: 0; border: 1px solid var(--linea); border-radius: 6px; overflow: hidden; min-width: 0; }
.diff figcaption { padding: 5px 10px; font-size: 12.5px; font-weight: 600; border-bottom: 1px solid var(--linea); display: flex; justify-content: space-between; align-items: center; }
.diff .a figcaption { background: var(--antes); color: var(--trampa-tinta); }
.diff .b figcaption { background: var(--despues); color: var(--verde); }
.diff .cod { padding: 6px 0; font-size: 12.5px; }
.diff .ln::before { width: 0; padding-right: 10px; content: ""; }
.mini { border: 0; background: none; font-size: 12px; color: inherit; text-decoration: underline; padding: 0; }

/* Notas */
.notas textarea { width: 100%; min-height: 120px; resize: vertical; border: 1px solid var(--linea2); border-radius: 8px; padding: 12px 14px; background: var(--hoja); font-size: 14px; line-height: 1.5; }
.notas textarea:focus { outline: none; border-color: var(--verde); box-shadow: 0 0 0 3px var(--verde-suave); }
.notas small { color: var(--tenue); font-size: 12.5px; }

/* ---------- Panel de explicación ---------- */
.pv { color: var(--tinta2); font-size: 14px; }
.pv h2 { font-size: 15px; color: var(--tinta); margin-bottom: 8px; }
.pv p { margin: 0 0 12px; }
.pv .atajos { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--linea); }
.pv .atajos div { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 13px; }
.pf-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.pf-cab h2 { font: 600 18px var(--f-cod); color: var(--f); word-break: break-word; }
.cerrar { border: 0; background: none; color: var(--tenue); font-size: 20px; line-height: 1; padding: 2px 6px; border-radius: 5px; }
.cerrar:hover { background: var(--hundido); color: var(--tinta); }
.firma { margin: 0 0 14px; padding: 10px 12px; background: var(--cod-bg); border: 1px solid var(--linea); border-radius: 6px; font: 13px/1.55 var(--f-cod); white-space: pre-wrap; word-break: break-word; }
.pf p.que { font-size: 15px; color: var(--tinta); margin: 0 0 16px; line-height: 1.55; }
.pf h3 { font-size: 12.5px; font-weight: 600; color: var(--tenue); margin: 16px 0 6px; }
.params { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.params td { padding: 7px 0; border-top: 1px solid var(--linea); vertical-align: top; }
.params td:first-child { font-family: var(--f-cod); font-size: 12.5px; color: var(--tinta); padding-right: 12px; white-space: nowrap; }
.params td:last-child { color: var(--tinta2); }
.eqv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13.5px; }
.eqv dt { color: var(--tenue); }
.eqv dd { margin: 0; font-family: var(--f-cod); font-size: 12.5px; color: var(--tinta); word-break: break-word; white-space: pre-wrap; }
.alerta { margin-top: 16px; padding: 10px 12px; border-left: 3px solid var(--trampa-borde); background: var(--trampa); color: var(--trampa-tinta); border-radius: 0 6px 6px 0; font-size: 13.5px; }
.alerta b { display: block; margin-bottom: 2px; }
.aviso { margin-top: 10px; padding: 10px 12px; border-left: 3px solid var(--cambiar-borde); background: var(--cambiar); color: var(--cambiar-tinta); border-radius: 0 6px 6px 0; font-size: 13.5px; }
.aviso ul { margin: 4px 0 0; padding-left: 18px; }
.donde { font-size: 12.5px; color: var(--tenue); margin-top: 14px; }

/* Tooltip y toast */
.tip { position: fixed; z-index: 70; max-width: 340px; padding: 8px 11px; border-radius: 6px; background: var(--tinta); color: var(--bg); font-size: 13px; line-height: 1.45; pointer-events: none; box-shadow: var(--sombra); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 80; padding: 9px 16px; border-radius: 8px; background: var(--tinta); color: var(--bg); font-size: 14px; box-shadow: var(--sombra); }


/* ---------- Fase 2: De enunciado a código ---------- */
.nav-tit { padding: 4px 10px 6px; font-size: 12.5px; font-weight: 600; color: var(--tenue); }
.nav-m .cuenta { float: right; color: var(--tenue); font-size: 11.5px; }
.analiza { border: 1px solid var(--linea2); border-radius: 8px; background: var(--hoja); overflow: hidden; }
.analiza:focus-within { border-color: var(--verde); box-shadow: 0 0 0 3px var(--verde-suave); }
.analiza textarea { display: block; width: 100%; min-height: 150px; resize: vertical; border: 0; outline: none; background: transparent; padding: 12px 14px; font-size: 14px; line-height: 1.55; }
.analiza-pie { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 12px; background: var(--hundido); border-top: 1px solid var(--linea); font-size: 13px; color: var(--tenue); }
.chip { display: inline-flex; align-items: center; border: 1px solid var(--linea2); background: var(--hoja); border-radius: 999px; padding: 3px 11px; font-size: 13px; color: var(--tinta); margin: 0 6px 6px 0; }
.analiza-pie .chip { margin: 0; }
button.chip:hover { border-color: var(--verde); color: var(--verde); }
.chip.quitar { color: var(--tenue); }
.chip.cod-chip { font-family: var(--f-cod); font-size: 12.5px; }
.chip.quieto { font-family: var(--f-cod); font-size: 12.5px; background: var(--hundido); }
.vacio { margin: 14px 0 0; color: var(--tinta2); font-size: 14px; max-width: 72ch; }
.tenue { color: var(--tenue); font-size: 13.5px; }
.resumen { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin: 16px 0 12px; }
.res-bloque { border: 1px solid var(--linea); border-radius: 8px; background: var(--hoja); padding: 10px 12px 6px; }
.res-bloque h3, .piezas-cab h3 { font-size: 12.5px; font-weight: 600; color: var(--tenue); margin: 0 0 8px; }
.res-bloque .btn { margin-bottom: 6px; }
.marcado { border: 1px solid var(--linea); border-radius: 8px; background: var(--hoja); margin-bottom: 18px; }
.marcado summary { cursor: pointer; padding: 9px 14px; font-size: 14px; font-weight: 600; }
.marcado summary span { font-weight: 400; color: var(--tenue); margin-left: 6px; }
.marcado-txt { padding: 0 14px 14px; white-space: pre-wrap; font-size: 14px; line-height: 1.7; color: var(--tinta2); max-width: 90ch; }
.marcado-txt mark { background: var(--verde-suave); color: var(--tinta); border-bottom: 2px solid var(--verde); padding: 0 1px; border-radius: 2px; cursor: pointer; }
.marcado-txt mark:hover { background: var(--verde-medio); }
.piezas-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0 4px; }
.piezas-cab h3 { margin: 0; font-size: 15px; color: var(--tinta); }
.pieza-cat, .cat-tit { font-size: 13px; font-weight: 600; color: var(--verde); margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--linea); }
.cat-tit { font-size: 15px; scroll-margin-top: 175px; }
.pieza { border: 1px solid var(--linea); border-radius: 8px; background: var(--hoja); margin-bottom: 10px; overflow: hidden; scroll-margin-top: 175px; }
.pieza-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 10px 12px 0 14px; }
.pieza-cab h4 { margin: 0; font-size: 15px; font-weight: 600; }
.pidio { margin: 2px 0 0; font-size: 13px; color: var(--verde); }
.pidio.otro { color: var(--tenue); }
.pieza-acc { display: flex; gap: 6px; flex: none; }
.pieza-q { margin: 6px 14px 10px; font-size: 14px; color: var(--tinta2); max-width: 78ch; }
.pieza .cod { border-top: 1px solid var(--linea); }
.pieza-tr { margin: 0; padding: 8px 14px; font-size: 13.5px; background: var(--trampa); color: var(--trampa-tinta); border-top: 1px solid var(--linea); }
.frase { border: 1px solid var(--linea); border-radius: 8px; background: var(--hoja); margin-bottom: 6px; scroll-margin-top: 175px; }
.frase summary { cursor: pointer; list-style: none; padding: 9px 14px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.frase summary::-webkit-details-marker { display: none; }
.frase summary::before { content: "+"; font: 600 15px var(--f-cod); color: var(--verde); width: 12px; }
.frase[open] summary::before { content: "−"; }
.frase summary b { font-weight: 600; font-size: 14.5px; }
.frase summary span { color: var(--tenue); font-size: 13px; }
.frase-cuerpo { padding: 0 10px 10px; }
.frase-cuerpo .pieza { margin: 0; }
@media (max-width: 860px) { .pieza-cab { flex-direction: column; } .piezas-cab { flex-direction: column; align-items: flex-start; } }

/* ---------- Fase 3: Diccionario de funciones ---------- */
.filtro { position: sticky; top: var(--alto, 118px); z-index: 20; display: flex; gap: 8px; padding: 10px 0; background: var(--bg); }
.filtro input { flex: 1; min-width: 0; border: 1px solid var(--linea2); border-radius: 7px; padding: 7px 12px; background: var(--hoja); font-size: 14px; }
.filtro input:focus { outline: none; border-color: var(--verde); box-shadow: 0 0 0 3px var(--verde-suave); }
.ficha { border: 1px solid var(--linea); border-radius: 8px; background: var(--hoja); margin-bottom: 6px; scroll-margin-top: 175px; }
.ficha summary { cursor: pointer; list-style: none; padding: 9px 14px; display: grid; grid-template-columns: 12px minmax(140px, 240px) 1fr; gap: 12px; align-items: baseline; }
.ficha summary::-webkit-details-marker { display: none; }
.ficha summary::before { content: "+"; font: 600 15px var(--f-cod); color: var(--verde); }
.ficha[open] summary::before { content: "−"; }
.ficha summary b { font: 600 13.5px var(--f-cod); color: var(--f); }
.ficha summary span { color: var(--tinta2); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ficha[open] summary span { white-space: normal; visibility: hidden; height: 0; }
.ficha-cuerpo { padding: 0 16px 14px 38px; max-width: 760px; }
.ficha-cuerpo .pf-cab { display: none; }
.firma .tok, .firma .k, .firma .s, .firma .n, .firma .c { font: inherit; }
.firma .k { color: var(--k); } .firma .s { color: var(--s); } .firma .n { color: var(--n); } .firma .c { color: var(--c); font-style: italic; }
.usos { display: flex; flex-wrap: wrap; }
.src { width: 100%; margin: 0 0 8px; font-size: 13px; color: var(--tinta2); }
@media (max-width: 860px) { .ficha summary { grid-template-columns: 12px 1fr; } .ficha summary span { grid-column: 2; } .ficha-cuerpo { padding-left: 16px; } }

/* ---------- Fase 4: Errores y checklist ---------- */
.fuera { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 999px; background: var(--hundido); border: 1px solid var(--linea2); color: var(--tenue); font-size: 11.5px; font-weight: 600; }
.err { border: 1px solid var(--linea); border-radius: 8px; background: var(--hoja); margin-bottom: 6px; scroll-margin-top: 175px; }
.err summary { cursor: pointer; list-style: none; padding: 9px 14px; display: flex; gap: 12px; align-items: baseline; }
.err summary::-webkit-details-marker { display: none; }
.err .num { flex: none; min-width: 44px; text-align: center; padding: 1px 6px; border-radius: 5px; background: var(--trampa); color: var(--trampa-tinta); font: 600 12.5px var(--f-cod); }
#err-comp .num { background: var(--cambiar); color: var(--cambiar-tinta); }
#err-mudo .num { background: var(--hundido); color: var(--tenue); }
.err summary b { font: 500 13.5px var(--f-cod); color: var(--tinta); word-break: break-word; }
.err-cuerpo { padding: 0 16px 14px 70px; max-width: 900px; }
.err-cuerpo .que { margin: 0 0 10px; color: var(--tinta); }
.err-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.err-cols h3 { font-size: 12.5px; color: var(--tenue); font-weight: 600; margin: 0 0 4px; }
.err-cols ul { margin: 0; padding-left: 18px; font-size: 14px; color: var(--tinta2); }
.err-cols li { margin-bottom: 4px; }
.err-cuerpo .firma { margin-top: 10px; }
.err-cuerpo .usos { margin-top: 8px; }
.teclas { width: 100%; border-collapse: collapse; background: var(--hoja); border: 1px solid var(--linea); border-radius: 8px; overflow: hidden; font-size: 14px; }
.teclas td { padding: 8px 14px; border-top: 1px solid var(--linea); vertical-align: top; color: var(--tinta2); }
.teclas tr:first-child td { border-top: 0; }
.teclas td:first-child { width: 220px; white-space: nowrap; }
#checklist h2 .mini { margin-left: auto; color: var(--tenue); }
@media (max-width: 860px) { .err-cuerpo { padding-left: 16px; } .err-cols { grid-template-columns: 1fr; } .teclas td:first-child { width: auto; white-space: normal; } }

/* ---------- Responsive ---------- */
.solo-movil { display: none; }
@media (max-width: 1240px) {
  .marco { grid-template-columns: 200px minmax(0, 1fr); }
  .panel { position: fixed; top: auto; right: 0; bottom: 0; height: auto; max-height: 72vh; width: min(420px, 100%); border: 1px solid var(--linea2); border-radius: 12px 0 0 0; box-shadow: var(--sombra); z-index: 60; transform: translateY(105%); transition: transform .2s ease; }
  .panel.abierto { transform: none; }
  .panel-in { max-height: 72vh; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
}
@media (max-width: 860px) {
  .marco { display: block; }
  .nav { position: static; max-height: none; display: flex; gap: 6px; overflow-x: auto; padding: 12px 16px 0; }
  .nav-m, .nav-sep, .nav-ayuda { display: none; }
  .nav-p { flex: none; width: auto; white-space: nowrap; border: 1px solid var(--linea); background: var(--hoja); }
  .contenido { padding: 16px 16px 120px; }
  .marca div { display: none; }
  .barra { gap: 10px; }
  .pide li { grid-template-columns: 1fr; gap: 2px; }
  .diff { grid-template-columns: 1fr; }
  .leyenda { margin-left: 0; }
  .herr { top: var(--alto, 106px); }
  .panel { width: 100%; border-radius: 12px 12px 0 0; }
  .cabeza h1 { font-size: 23px; }
}
@media (prefers-reduced-motion: reduce) { .panel { transition: none; } }

/* Impresión: el kit en papel como respaldo */
@media print {
  .top, .nav, .panel, .herr, .notas, .adapt { display: none !important; }
  .marco { display: block; }
  .contenido { padding: 0; }
  .macro { box-shadow: none; break-inside: avoid-page; }
  .ln.cambiar, .ln.trampa { background: none; }
  .var { break-inside: avoid; }
  .var .var-cuerpo { display: block !important; }
  body { background: #fff; }
}
.nav-m.nav-c { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-family: var(--f-texto); font-size: 13.5px; padding: 4px 10px 4px 14px; white-space: normal; text-overflow: clip; }
.nav-m.nav-c .cuenta { float: none; flex: none; }

</style>
</head>
<body>

<header class="top">
  <div class="barra">
    <div class="marca">
      <span class="logo" aria-hidden="true">fx</span>
      <div>
        <b>Kit VBA</b>
        <small>Control 2, Excel en inglés</small>
      </div>
    </div>

    <div class="formula" role="search">
      <span class="nombre" id="cajaNombre" title="Problema abierto">A1</span>
      <label class="fx" for="q">Buscar</label>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Función, macro, frase o error: InStr, BuscarTicket, sin repetir, 1004…  ( / )">
      <div class="resultados" id="resultados" hidden role="listbox"></div>
    </div>

    <button class="icono" id="tema" type="button" title="Cambiar tema claro u oscuro" aria-label="Cambiar tema">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>

  <nav class="pestanas" aria-label="Secciones">
    <button class="pes activa" type="button" data-vista="problemas">Mis 4 problemas</button>
    <button class="pes" type="button" data-vista="enunciado">De enunciado a código</button>
    <button class="pes" type="button" data-vista="funciones">Funciones</button>
    <button class="pes" type="button" data-vista="errores">Errores y checklist</button>
  </nav>
</header>

<div class="marco">
  <aside class="nav" id="nav" aria-label="Problemas"></aside>
  <main class="contenido" id="vista"></main>
  <aside class="panel" id="panel" aria-label="Explicación">
    <div class="panel-in" id="panelIn"></div>
  </aside>
</div>

<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
/* Diccionario de funciones y palabras de VBA.
   Clave: la palabra en minúsculas. Con punto adelante (".value")
   si es una propiedad o método que va después de un objeto.
   Campos:
     n  nombre que se muestra      f  cómo se escribe
     q  qué hace                    p  parámetros [nombre, explicación]
     r  qué devuelve                ej ejemplo
     py equivalente en Python       xl equivalente en Excel (inglés / español)
     tr trampa típica
   Este archivo se amplía en la fase 3 (Diccionario de funciones). */

window.FN = {

/* ---------- Estructura ---------- */
"option": { n:"Option Explicit", f:"Option Explicit",
  q:"Obliga a declarar con Dim toda variable antes de usarla. Va en la primera línea del módulo, fuera de cualquier Sub.",
  tr:"Sin esta línea, un nombre mal escrito (totl en vez de total) crea una variable vacía nueva y el resultado sale mal sin ningún error.",
  ej:"Activalo para siempre en Tools → Options → Require Variable Declaration." },
"explicit": { al:"option" },
"sub": { n:"Sub … End Sub", f:"Sub Nombre()\n    ' instrucciones\nEnd Sub",
  q:"Un procedimiento: un bloque de instrucciones que HACE algo (escribir, pintar, mostrar). No devuelve un valor.",
  p:[["Nombre","El nombre de la macro. Si el enunciado lo da (CalcularParqueo), escribilo idéntico: se revisa en Alt+F8."],["( )","Vacío = se puede correr con F5 y aparece en Alt+F8. Con parámetros = solo lo puede llamar otro procedimiento."]],
  py:"def nombre():", tr:"Todo código que se ejecuta va dentro de un Sub o Function. Fuera solo van Option Explicit, Const y Dim del módulo." },
"function": { n:"Function … End Function", f:"Function Nombre(ByVal x As Double) As Double\n    Nombre = x * 2\nEnd Function",
  q:"Calcula y DEVUELVE un valor. El valor se devuelve asignándolo al nombre de la función (no existe return). Si es pública y está en un módulo normal, se puede usar como fórmula en la hoja.",
  p:[["parámetros","Lo que recibe, cada uno con su tipo."],["As Tipo (al final)","El tipo de dato que devuelve."]],
  py:"def nombre(x):\n    return x * 2", tr:"Si la fórmula en la hoja da #NAME?, la función está en el módulo de una hoja (Sheet1) en vez de un módulo normal (Insert → Module), o el nombre está mal escrito." },
"end": { n:"End …", f:"End Sub · End Function · End If · End With · End Select",
  q:"Cierra un bloque. Cada bloque que abrís (Sub, If, With, Select Case, Function) necesita su End correspondiente.",
  tr:"El error \"Block If without End If\" significa que falta un End If." },
"exit": { n:"Exit", f:"Exit Sub · Exit Function · Exit For · Exit Do",
  q:"Sale antes de tiempo. Exit Sub y Exit Function terminan el procedimiento (como return). Exit For y Exit Do rompen el bucle (como break).",
  py:"return / break", ej:"If resp = \"\" Then Exit Sub" },
"call": { n:"Call", f:"Call Nombre(a, b)",
  q:"Llama a un Sub que tiene parámetros usando paréntesis. Sin Call, se escribe sin paréntesis: Nombre a, b.",
  tr:"PintarFila(ws, fila, color) sin Call da error de sintaxis. O ponés Call adelante, o quitás los paréntesis." },
"private": { n:"Private", f:"Private Sub … / Private Function …",
  q:"Solo lo pueden usar los procedimientos del MISMO módulo. No aparece en Alt+F8 ni sirve como fórmula en la hoja. Sirve para piezas internas.",
  tr:"Si la macro que la usa está en otro módulo, da \"Sub or Function not defined\"." },
"public": { n:"Public", f:"Public Sub … / Public Function …",
  q:"Se puede usar desde cualquier módulo, desde Alt+F8 (si es un Sub sin parámetros) y como fórmula en la hoja (si es Function). Es lo mismo que no escribir nada." },
"byval": { n:"ByVal", f:"(ByVal x As Double)",
  q:"El parámetro recibe una COPIA del valor. Si la función lo cambia por dentro, el valor original no cambia.",
  tr:"Sin ByVal, VBA usa ByRef: los cambios dentro del procedimiento sí afectan la variable original." },
"byref": { n:"ByRef", f:"(ByRef x As Double)", q:"El parámetro apunta a la variable original: si se cambia dentro, cambia afuera. Es el comportamiento por defecto de VBA." },
"optional": { n:"Optional", f:"Optional ByVal bono As Double = 0",
  q:"Un parámetro que se puede omitir al llamar. Si se omite, toma el valor que está después del =.",
  p:[["= valor","El valor por defecto."]], py:"def f(prima, ramo, bono=0):",
  tr:"Los parámetros Optional van siempre al FINAL de la lista." },

/* ---------- Variables y tipos ---------- */
"dim": { n:"Dim", f:"Dim nombre As Tipo\nDim a As Long, b As Double",
  q:"Declara una variable: le da un nombre y un tipo. Los números arrancan en 0, los textos en \"\".",
  p:[["nombre","Cómo la vas a llamar. Sin espacios ni tildes es lo más seguro."],["As Tipo","Long (entero), Double (decimal), String (texto), Boolean, Date, Variant, Worksheet, Range…"]],
  tr:"Dim a, b As Long deja a como Variant. Cada variable necesita su propio As: Dim a As Long, b As Long." },
"tipos": { n:"Tipos de datos", f:"Long · Double · String · Boolean · Date · Variant · Object",
  q:"Long: enteros (filas, contadores). Double: decimales (dinero, minutos). String: texto. Boolean: True/False. Date: fechas y horas. Variant: cualquier cosa, incluso una tabla entera leída de la hoja. Object: objetos genéricos como un Dictionary.",
  tr:"No uses Integer: se desborda a partir de 32,767 filas o valores." },
"long": { al:"tipos" }, "double": { al:"tipos" }, "string": { al:"tipos" }, "boolean": { al:"tipos" },
"variant": { al:"tipos" }, "date": { n:"Date", f:"Dim f As Date · Date",
  q:"Como tipo: guarda una fecha u hora. Como función (sola, sin paréntesis): devuelve la fecha de HOY.", py:"datetime.date.today()", xl:"TODAY() / HOY()" },
"object": { al:"tipos" },
"set": { n:"Set", f:"Set variable = objeto",
  q:"Asigna un OBJETO a una variable: una hoja, un rango, una Collection, un Dictionary. Los valores simples (números, textos) se asignan sin Set.",
  ej:"Set ws = ThisWorkbook.Worksheets(\"A1 Parqueo\")\nminutos = ws.Range(\"F2\").Value   ' valor: sin Set",
  tr:"Olvidar Set da el error 91 \"Object variable not set\". Poner Set con un número da \"Object required\"." },
"new": { n:"New", f:"Set col = New Collection", q:"Crea un objeto nuevo vacío. Se usa con Set." },
"worksheet": { n:"Worksheet", f:"Dim ws As Worksheet", q:"Tipo de dato para guardar una hoja. Se asigna con Set." },
"range": { n:"Range", f:"ws.Range(\"A1\") · ws.Range(\"A2:F\" & ultima) · Dim cel As Range",
  q:"Una celda o un rango, escrito como en Excel. Como tipo (As Range), guarda una celda o un rango; se asigna con Set.",
  p:[["\"texto\"","La dirección: \"F1\", \"A2:F31\". Se arma con & para que sea dinámica: \"B2:B\" & ultima."]],
  ej:"ws.Range(\"F1\").Value = \"Minutos\"\nws.Range(\"G2:G\" & ultima).Formula = \"=D2*2\"" },
".range": { al:"range" },
"collection": { n:"Collection", f:"Dim col As Collection\nSet col = New Collection",
  q:"Una lista. Se agrega con .Add, se cuenta con .Count, se lee con col(1) (empieza en 1) y se recorre con For Each.",
  py:"lista = []", tr:"No tiene un \"in\" para saber si algo ya está: hay que recorrerla y comparar." },
"me": { n:"Me", q:"Dentro del módulo de una hoja, Me es esa misma hoja." },

/* ---------- Hojas, celdas y rangos ---------- */
"thisworkbook": { n:"ThisWorkbook", f:"ThisWorkbook.Worksheets(\"Hoja\")",
  q:"El libro donde está guardado el código. Es más seguro que ActiveWorkbook, que es el libro que esté activo en pantalla." },
"worksheets": { n:"Worksheets", f:"Worksheets(\"Nombre\") · Worksheets(1) · Worksheets.Count",
  q:"Todas las hojas del libro. Con un texto, la hoja con ese nombre; con un número, la hoja en esa posición; .Count dice cuántas hay.",
  p:[["\"Nombre\"","El nombre exacto de la pestaña, con espacios y tildes."]],
  tr:"Error 9 \"Subscript out of range\": el nombre de la hoja no coincide exactamente (un espacio de más, una tilde)." },
".worksheets": { al:"worksheets" },
"cells": { n:"Cells", f:"ws.Cells(fila, columna)",
  q:"Una celda por número de fila y de columna. Es la forma ideal para bucles.",
  p:[["fila","Número de fila (1, 2, 3…). Normalmente la variable del For."],["columna","Número (A=1, B=2, C=3…) o letra entre comillas (\"C\")."]],
  ej:"ws.Cells(2, 6).Value   ' F2", py:"ws.cell(fila, columna)",
  tr:"Empieza en 1, no en 0 como en Python." },
".cells": { al:"cells" },
".rows": { n:".Rows", f:"ws.Rows.Count · ws.Rows(5)", q:"Las filas de la hoja. ws.Rows.Count es la cantidad total de filas (1,048,576); se usa para arrancar desde el fondo al buscar la última fila." },
".columns": { n:".Columns", f:"ws.Columns(\"A:D\") · ws.Columns(3)", q:"Columnas enteras. Se usa para AutoFit, borrar o dar formato a columnas completas." },

macros:[
{n:"CalcularParqueo", kw:"tramos tarifa cobro minutos horas tope descuento cortesia recorrer filas", d:"Llena las 4 columnas de resultado e imprime el resumen.", code:
`Sub CalcularParqueo()
    '2 Calcula minutos, cobro, descuento y valor a pagar de cada ticket. Resultado en Immediate (Ctrl+G).
    Dim ws As Worksheet '1 la hoja de datos
    Dim ultima As Long, fila As Long '1 última fila y contador
    Dim minutos As Double, medias As Double
    Dim cobro As Double, desc As Double, pagar As Double
    Dim total As Double, cortesias As Long '1 acumuladores (arrancan en 0)

    Set ws = ThisWorkbook.Worksheets("{{HOJA}}") '! una hoja es un objeto: lleva Set
    ultima = ws.Cells(ws.Rows.Count, "{{C_TICKET}}").End(xlUp).Row '1 última fila con datos

    '1 Encabezados
    ws.Cells(1, {{C_MIN#}}).Value = "Minutos"
    ws.Cells(1, {{C_COBRO#}}).Value = "Cobro"
    ws.Cells(1, {{C_DESC#}}).Value = "Descuento"
    ws.Cells(1, {{C_PAGAR#}}).Value = "Valor a pagar"

    For fila = 2 To ultima '1 fila 1 = encabezados
        '1 Minutos: una hora es fracción del día; x 1440 = minutos
        minutos = Round((ws.Cells(fila, {{C_SAL#}}).Value _
                  - ws.Cells(fila, {{C_ENT#}}).Value) * 1440, 0)

        '1 Tramos: VBA entra al primero que se cumpla
        If minutos <= {{CORTESIA}} Then
            cobro = 0
            cortesias = cortesias + 1 '! cortesía se cuenta por tiempo, no por pagar = 0
        ElseIf minutos <= {{HORA}} Then
            cobro = {{PRIMERA}}
        Else
            '2 "Cada bloque adicional o fracción" = redondear hacia arriba. -Int(-x) es el techo de x.
            medias = -Int(-(minutos - {{HORA}}) / {{BLOQUE}}) '1 bloques extra, hacia arriba '! Round aquí da mal: 61 min daría 0 bloques
            cobro = {{PRIMERA}} + {{MEDIA}} * medias
        End If
        If cobro > {{TOPE}} Then cobro = {{TOPE}} '1 tope del día

        '1 Descuento por sello
        If ws.Cells(fila, {{C_SELLO#}}).Value = "{{SI}}" Then '! texto exacto: "Si" sin tilde no coincide
            desc = {{DESC}}
        Else
            desc = 0
        End If
        pagar = Application.WorksheetFunction.Max(cobro - desc, 0) '1 nunca negativo

        '1 Escribir la fila
        ws.Cells(fila, {{C_MIN#}}).Value = minutos
        ws.Cells(fila, {{C_COBRO#}}).Value = cobro
        ws.Cells(fila, {{C_DESC#}}).Value = desc
        ws.Cells(fila, {{C_PAGAR#}}).Value = pagar
        total = total + pagar
    Next fila

    Debug.Print "Tickets procesados: " & (ultima - 1) '! ultima es la fila, no la cantidad
    Debug.Print "Cortesías: " & cortesias
    Debug.Print "Total a cobrar: " & Format(total, "$#,##0.00")
End Sub`},

{n:"BuscarTicket", kw:"buscar codigo pedir dato inputbox cancelar no existe mostrar mensaje", d:"Pide un ticket, lo busca y muestra sus datos.", code:
`Sub BuscarTicket()
    '2 Pide un ticket con InputBox, lo busca fila por fila y muestra sus datos en un solo MsgBox.
    Dim ws As Worksheet
    Dim resp As String '1 lo que escribe el usuario
    Dim ultima As Long, fila As Long
    Dim filaEnc As Long '1 fila encontrada (0 = no existe)

    Set ws = ThisWorkbook.Worksheets("{{HOJA}}")
    If ws.Cells(2, {{C_PAGAR#}}).Value = "" Then CalcularParqueo '1 si falta calcular, calcular primero

    '1 Pedir el dato
    resp = InputBox("Número de ticket:", "Buscar ticket")
    If StrPtr(resp) = 0 Then Exit Sub '1 presionó Cancelar: no pasa nada
    resp = UCase(Trim(resp)) '1 " pq-0117 " -> "PQ-0117"
    If resp = "" Then Exit Sub '1 aceptó la caja vacía

    '1 Buscar fila por fila
    ultima = ws.Cells(ws.Rows.Count, "{{C_TICKET}}").End(xlUp).Row
    For fila = 2 To ultima
        If UCase(Trim(ws.Cells(fila, {{C_TICKET#}}).Value)) = resp Then '! normalizar los dos lados antes de comparar
            filaEnc = fila
            Exit For '1 ya está: dejar de buscar
        End If
    Next fila

    If filaEnc = 0 Then
        MsgBox "El ticket " & resp & " no existe.", vbExclamation, "Buscar ticket"
        Exit Sub
    End If

    '1 Un solo MsgBox, un dato por línea
    With ws
        MsgBox "Ticket: " & .Cells(filaEnc, {{C_TICKET#}}).Value & vbCrLf & _
               "Placa: " & .Cells(filaEnc, {{C_PLACA#}}).Value & vbCrLf & _
               "Entrada: " & Format(.Cells(filaEnc, {{C_ENT#}}).Value, "h:mm AM/PM") & vbCrLf & _
               "Salida: " & Format(.Cells(filaEnc, {{C_SAL#}}).Value, "h:mm AM/PM") & vbCrLf & _
               "Minutos: " & .Cells(filaEnc, {{C_MIN#}}).Value & vbCrLf & _
               "Valor a pagar: " & Format(.Cells(filaEnc, {{C_PAGAR#}}).Value, "$#,##0.00"), _
               vbInformation, "Ticket encontrado"
    End With
End Sub`},

{n:"ValidarPlacas", kw:"validar formato patron like resaltar amarillo for each", d:"Marca las placas que no cumplen el patrón.", code:
`Sub ValidarPlacas()
    '2 Compara cada placa con el patrón. Incorrecta: amarillo e imprime su ticket. Correcta: sin relleno.
    Dim ws As Worksheet
    Dim cel As Range '1 cada celda del For Each
    Dim ultima As Long, malas As Long

    Set ws = ThisWorkbook.Worksheets("{{HOJA}}")
    ultima = ws.Cells(ws.Rows.Count, "{{C_PLACA}}").End(xlUp).Row

    For Each cel In ws.Range("{{C_PLACA}}2:{{C_PLACA}}" & ultima)
        If cel.Value Like "{{PATRON}}" Then '1 # = un dígito '! Like distingue mayúsculas: "p245-118" no cumple
            cel.Interior.ColorIndex = xlNone '1 correcta: quitar relleno viejo
        Else
            cel.Interior.Color = vbYellow
            Debug.Print ws.Cells(cel.Row, {{C_TICKET#}}).Value '1 ticket de esa fila
            malas = malas + 1
        End If
    Next cel

    If malas > 0 Then
        MsgBox "Hay " & malas & " placas incorrectas.", vbExclamation, "Validar placas"
    Else
        MsgBox "Todas las placas están correctas.", vbInformation, "Validar placas"
    End If
End Sub`}

{n:"LimpiarContactos", kw:"limpiar texto espacios mayusculas minusculas nombre propio correo arroba dominio", d:"Nombre limpio, correo en minúsculas y dominio.", code:
`Sub LimpiarContactos()
    '2 Limpia el contacto (G), el correo (H) y saca el dominio (I). Correos sin exactamente una @: "Revisar".
    Dim ws As Worksheet
    Dim ultima As Long, fila As Long
    Dim contacto As String, correo As String
    Dim arrobas As Long '1 cuántas @ tiene el correo

    Set ws = ThisWorkbook.Worksheets("{{HOJA}}")
    ultima = ws.Cells(ws.Rows.Count, "{{C_FACT}}").End(xlUp).Row

    ws.Cells(1, {{C_CONT_L#}}).Value = "Contacto limpio"
    ws.Cells(1, {{C_CORREO_L#}}).Value = "Correo limpio"
    ws.Cells(1, {{C_DOM#}}).Value = "Dominio"

    For fila = 2 To ultima
        '1 Contacto: Trim de Excel (también quita dobles del medio) y luego Proper
        contacto = ws.Cells(fila, {{C_CONT#}}).Value
        contacto = Application.WorksheetFunction.Trim(contacto) '! el Trim de VBA solo no quita los espacios del medio
        contacto = Application.WorksheetFunction.Proper(contacto)
        ws.Cells(fila, {{C_CONT_L#}}).Value = contacto

        '1 Correo: minúsculas y sin espacios alrededor
        correo = LCase(Trim(ws.Cells(fila, {{C_CORREO#}}).Value))
        ws.Cells(fila, {{C_CORREO_L#}}).Value = correo

        '1 Contar @: largo total menos largo sin las @
        arrobas = Len(correo) - Len(Replace(correo, "@", ""))

        If arrobas = 1 Then
            ws.Cells(fila, {{C_DOM#}}).Value = Mid(correo, InStr(correo, "@") + 1) '1 todo lo que va después de la @
            ws.Cells(fila, {{C_DOM#}}).Interior.ColorIndex = xlNone
        Else
            ws.Cells(fila, {{C_DOM#}}).Value = "Revisar"
            ws.Cells(fila, {{C_DOM#}}).Interior.Color = vbYellow
        End If
    Next fila
End Sub`},

{n:"VencimientosProveedores", kw:"vencimiento fecha fin de semana sabado domingo lunes atraso dias vencida corte colores", d:"Vencimiento con fin de semana, atraso y estado.", code:
`Sub VencimientosProveedores()
    '2 Vencimiento = fecha + días de crédito; si cae sábado o domingo, pasa al lunes. Atraso a la fecha de corte.
    Dim ws As Worksheet
    Dim ultima As Long, fila As Long
    Dim corte As Date, venc As Date
    Dim atraso As Long
    Dim nVencidas As Long, montoVencido As Double

    Set ws = ThisWorkbook.Worksheets("{{HOJA}}")
    corte = ThisWorkbook.Worksheets("{{HOJA_PAR}}").Range("{{CELDA_CORTE}}").Value '1 se lee de la hoja, no se escribe en el código
    ultima = ws.Cells(ws.Rows.Count, "{{C_FACT}}").End(xlUp).Row

    ws.Cells(1, {{C_VENC#}}).Value = "Vencimiento"
    ws.Cells(1, {{C_ATR#}}).Value = "Días atraso"
    ws.Cells(1, {{C_EST#}}).Value = "Estado"

    For fila = 2 To ultima
        '1 Una fecha es un número: fecha + días = otra fecha
        venc = ws.Cells(fila, {{C_FECHA#}}).Value + ws.Cells(fila, {{C_DIAS#}}).Value

        '1 Weekday: 1 = domingo ... 7 = sábado
        If Weekday(venc) = 7 Then
            venc = venc + 2 '1 sábado -> lunes
        ElseIf Weekday(venc) = 1 Then
            venc = venc + 1 '1 domingo -> lunes
        End If
        ws.Cells(fila, {{C_VENC#}}).Value = venc
        ws.Cells(fila, {{C_VENC#}}).NumberFormat = "dd/mm/yyyy" '1 si no, se ve como número

        '1 Atraso: fecha - fecha = días; negativo = aún no vence
        atraso = corte - venc
        If atraso < 0 Then atraso = 0
        ws.Cells(fila, {{C_ATR#}}).Value = atraso

        '1 Estado por tramos
        If atraso = 0 Then
            ws.Cells(fila, {{C_EST#}}).Value = "Al día"
            ws.Cells(fila, {{C_EST#}}).Interior.ColorIndex = xlNone
        ElseIf atraso <= {{TRAMO}} Then
            ws.Cells(fila, {{C_EST#}}).Value = "Vencida 1-{{TRAMO}}"
            ws.Cells(fila, {{C_EST#}}).Interior.Color = vbYellow
        Else
            ws.Cells(fila, {{C_EST#}}).Value = "Vencida +{{TRAMO}}"
            ws.Cells(fila, {{C_EST#}}).Interior.Color = RGB(255, 199, 206) '1 rojo claro
        End If

        If atraso > 0 Then
            nVencidas = nVencidas + 1
            montoVencido = montoVencido + ws.Cells(fila, {{C_MONTO#}}).Value
        End If
    Next fila

    MsgBox "Facturas vencidas: " & nVencidas & vbCrLf & _
           "Monto vencido: " & Format(montoVencido, "$#,##0.00") & vbCrLf & _
           "Fecha de corte: " & Format(corte, "dd/mm/yyyy"), _
           vbInformation, "Vencimientos"
End Sub`}

macros:[
{n:"Comision", kw:"funcion propia optional byval tasa ramo select case redondeo", d:"Función pública: se usa en VBA y como fórmula.", code:
`Public Function Comision(ByVal prima As Double, ByVal ramo As String, _
                         Optional ByVal bono As Double = 0) As Double
    '2 Devuelve prima x tasa + bono, a 2 decimales. Public: sirve como fórmula =Comision() en la hoja.
    Dim tasa As Double

    ramo = LCase(Trim(ramo)) '1 " auto" o "HOGAR" -> "auto", "hogar"

    Select Case ramo '1 elegir la tasa según el ramo
        Case "{{R1}}": tasa = {{T1}} '! los Case van en minúsculas porque arriba se usó LCase
        Case "{{R2}}": tasa = {{T2}}
        Case "{{R3}}": tasa = {{T3}}
        Case "{{R4}}": tasa = {{T4}}
        Case Else: tasa = 0 '1 ramo desconocido
    End Select

    If prima <= 0 Or tasa = 0 Then
        Comision = 0 '1 "return 0": se asigna al nombre de la función
        Exit Function
    End If

    Comision = Application.WorksheetFunction.Round(prima * tasa + bono, 2) '1 redondeo comercial '! Round de VBA solo es bancario
End Function`},

`Private Sub PintarFila(ByVal ws As Worksheet, ByVal fila As Long, ByVal colorFila As Long)
    '2 Recibe la hoja, la fila y el color, y rellena desde la columna A hasta la última indicada.

{n:"ResaltarPrimasAltas", kw:"resaltar pintar quitar relleno contar privado call", d:"Pinta las primas altas y cuenta cuántas son.", code:
`Sub ResaltarPrimasAltas()
    '2 Usa las dos piezas privadas: EsPrimaAlta decide y PintarFila pinta.
    Dim ws As Worksheet
    Dim ultima As Long, fila As Long, altas As Long

    Set ws = ThisWorkbook.Worksheets("{{HOJA}}")
    ultima = ws.Cells(ws.Rows.Count, "A").End(xlUp).Row

    For fila = 2 To ultima
        If EsPrimaAlta(ws.Cells(fila, {{C_PRIMA#}}).Value) Then
            PintarFila ws, fila, RGB({{COLOR}}) '! Sub con parámetros: sin paréntesis (o con Call adelante)
            altas = altas + 1
        Else
            ws.Range("A" & fila & ":{{C_ULT}}" & fila).Interior.ColorIndex = xlNone '1 quitar relleno
        End If
    Next fila

    Debug.Print "Pólizas de prima alta: " & altas
End Sub`}

macros:[
{n:"TotalesPedidos", kw:"arreglo leer hoja una vez memoria escribir de una sola vez redim ubound", d:"Arreglo de entrada y de salida.", code:
`Sub TotalesPedidos()
    '2 Lee la tabla a memoria, calcula en un arreglo y pega todos los totales de una sola vez.
    Dim ws As Worksheet
    Dim ultima As Long, n As Long, i As Long
    Dim datos As Variant '1 aquí cae la tabla entera '! un arreglo leído de la hoja va As Variant
    Dim totales() As Double '1 tamaño se define con ReDim
    Dim suma As Double

    Set ws = ThisWorkbook.Worksheets("{{HOJA}}")
    ultima = ws.Cells(ws.Rows.Count, "A").End(xlUp).Row
    datos = ws.Range("A2:{{C_ULT}}" & ultima).Value '1 la hoja se lee UNA sola vez
    n = UBound(datos, 1) '1 cuántas filas tiene el arreglo

    ReDim totales(1 To n, 1 To 1) '1 n filas, 1 columna '! debe ser 2D para pegarlo en una columna

    For i = 1 To n
        totales(i, 1) = Application.WorksheetFunction.Round(datos(i, {{C_UNI#}}) * datos(i, {{C_PRE#}}), 2) '1 unidades x precio
        suma = suma + totales(i, 1)
    Next i

    ws.Cells(1, {{C_TOT#}}).Value = "Total"
    ws.Range("{{C_TOT}}2:{{C_TOT}}" & ultima).Value = totales '1 todo de un golpe '! el rango debe tener el mismo tamaño que el arreglo

    Debug.Print "Pedidos: " & n
    Debug.Print "Suman: " & Format(suma, "$#,##0.00")
End Sub`},

{n:"ClientesDistintos", kw:"sin repetir unicos distintos collection lista", d:"Collection sin repetidos.", code:
`Sub ClientesDistintos()
    '2 Recorre los pedidos y agrega cada cliente a la lista solo si todavía no está.
    Dim ws As Worksheet
    Dim ultima As Long, i As Long, j As Long
    Dim datos As Variant
    Dim clientes As Collection
    Dim nombre As String
    Dim existe As Boolean
    Dim c As Variant '! la variable del For Each sobre una Collection va As Variant

    Set ws = ThisWorkbook.Worksheets("{{HOJA}}")
    ultima = ws.Cells(ws.Rows.Count, "A").End(xlUp).Row
    datos = ws.Range("A2:{{C_ULT}}" & ultima).Value

    Set clientes = New Collection '1 lista vacía (objeto: lleva Set)

    For i = 1 To UBound(datos, 1)
        nombre = datos(i, {{C_CLI#}})

        existe = False '1 ¿ya está en la lista? recorrerla y comparar
        For j = 1 To clientes.Count
            If clientes(j) = nombre Then
                existe = True
                Exit For
            End If
        Next j

        If existe = False Then clientes.Add nombre '1 agregar al final
    Next i

    Debug.Print "Clientes distintos: " & clientes.Count
    For Each c In clientes
        Debug.Print c
    Next c
End Sub`},

{n:"ResumenPorCategoria", kw:"total por categoria agrupar dictionary diccionario hoja nueva eliminar reemplazar resumen porcentaje mayor", d:"Dictionary, hoja nueva y formatos.", code:
`Sub ResumenPorCategoria()
    '2 Una pasada por los datos acumula ventas y pedidos por grupo; luego arma la hoja de resumen.
    Dim ws As Worksheet, wsR As Worksheet, hoja As Worksheet
    Dim ultima As Long, i As Long, fila As Long
    Dim datos As Variant
    Dim ventas As Object, pedidos As Object '1 dos diccionarios: grupo -> $ y grupo -> cantidad
    Dim cat As Variant '! la clave del For Each va As Variant
    Dim monto As Double, total As Double
    Dim mejorCat As String, mejorMonto As Double

    Set ws = ThisWorkbook.Worksheets("{{HOJA}}")
    ultima = ws.Cells(ws.Rows.Count, "A").End(xlUp).Row
    datos = ws.Range("A2:{{C_ULT}}" & ultima).Value

    '1 Acumular en una sola pasada
    Set ventas = CreateObject("Scripting.Dictionary")
    Set pedidos = CreateObject("Scripting.Dictionary")
    For i = 1 To UBound(datos, 1)
        cat = datos(i, {{C_CAT#}})
        monto = Application.WorksheetFunction.Round(datos(i, {{C_UNI#}}) * datos(i, {{C_PRE#}}), 2)
        If Not ventas.Exists(cat) Then '1 grupo nuevo: crearlo en 0
            ventas.Add cat, 0
            pedidos.Add cat, 0
        End If
        ventas(cat) = ventas(cat) + monto '1 como d[clave] += x
        pedidos(cat) = pedidos(cat) + 1
        total = total + monto
    Next i

    '1 Borrar la hoja de la ejecución anterior, sin preguntar
    Application.DisplayAlerts = False
    For Each hoja In ThisWorkbook.Worksheets
        If hoja.Name = "{{HOJA_RES}}" Then
            hoja.Delete
            Exit For
        End If
    Next hoja
    Application.DisplayAlerts = True '! volver a encender los avisos

    '1 Crear la hoja al final del libro
    Set wsR = ThisWorkbook.Worksheets.Add(After:=ThisWorkbook.Worksheets(ThisWorkbook.Worksheets.Count))
    wsR.Name = "{{HOJA_RES}}"

    '1 Tabla
    wsR.Range("A1:D1").Value = Array("{{ETIQ}}", "Pedidos", "Ventas ($)", "% del total")
    fila = 2
    For Each cat In ventas.Keys '1 en el orden en que aparecieron
        wsR.Cells(fila, 1).Value = cat
        wsR.Cells(fila, 2).Value = pedidos(cat)
        wsR.Cells(fila, 3).Value = ventas(cat)
        wsR.Cells(fila, 4).Value = ventas(cat) / total
        If ventas(cat) > mejorMonto Then '1 el mayor, a mano
            mejorMonto = ventas(cat)
            mejorCat = cat
        End If
        fila = fila + 1
    Next cat

    '1 Fila Total
    wsR.Cells(fila, 1).Value = "Total"
    wsR.Cells(fila, 2).Value = UBound(datos, 1)
    wsR.Cells(fila, 3).Value = total
    wsR.Cells(fila, 4).Value = 1

    '1 Formatos
    wsR.Range("A1:D1").Font.Bold = True
    wsR.Range("A" & fila & ":D" & fila).Font.Bold = True
    wsR.Range("C2:C" & fila).NumberFormat = "#,##0.00"
    wsR.Range("D2:D" & fila).NumberFormat = "0.0%"
    wsR.Columns("A:D").AutoFit

    MsgBox "{{ETIQ}} que más vendió: " & mejorCat & vbCrLf & _
           "Ventas: " & Format(mejorMonto, "$#,##0.00"), vbInformation, "Resumen"
End Sub`}
],

 {id:"A1", t:"A1 Parqueo", txt:"1. CalcularParqueo. Escribir en las columnas F a I, con sus encabezados, los minutos, el cobro, el descuento y el valor a pagar de cada ticket. La macro encuentra sola la última fila. Al final imprime en la ventana Immediate cuántos tickets procesó, cuántos fueron cortesía y el total a cobrar. Hasta 15 minutos: gratis. Más de 15 minutos: $1.00 por la primera hora y $0.50 por cada media hora adicional o fracción. El cobro máximo del día es $6.00. Con sello de compra se descuenta $1.00, sin que el pago quede negativo.\n2. BuscarTicket. Pedir el número de ticket con un InputBox; debe aceptarse aunque se escriba en minúsculas o con espacios. Si el usuario cancela, no pasa nada. Si el ticket no existe, se avisa. Si existe, un solo mensaje muestra ticket, placa, entrada, salida, minutos y valor a pagar, cada dato en su línea.\n3. ValidarPlacas. Las placas deben tener la forma P###-###. Recorrer la columna B con For Each, rellenar de amarillo las incorrectas e imprimir su ticket; a las correctas se les quita el relleno. Un MsgBox de advertencia o de información dice cuántas hay."},
 {id:"A2", t:"A2 Proveedores", txt:"1. LimpiarContactos. En G, el contacto sin espacios al inicio ni al final, sin espacios dobles o triples en medio y con la primera letra de cada palabra en mayúscula. En H, el correo en minúsculas y sin espacios alrededor. En I, el dominio: lo que va después de la @. Si el correo no tiene @ o tiene más de una, se escribe \"Revisar\" resaltado en amarillo.\n2. VencimientosProveedores. En J, la fecha de vencimiento (fecha de la factura más los días de crédito, pasada al lunes si cae en fin de semana). En K, los días de atraso a la fecha de corte (0 si todavía no vence). En L, el estado: \"Al día\", \"Vencida 1-30\" en amarillo o \"Vencida +30\" en rojo claro. La fecha de corte se lee de la hoja de parámetros. Al final, un MsgBox con el número de facturas vencidas, el monto vencido y la fecha de corte."},
 {id:"A3", t:"A3 Pólizas", txt:"1. Función Comision. Devuelve prima × tasa + bono, redondeado a 2 decimales. El bono es opcional y vale 0 si no se envía. Si la prima no es mayor que 0 o el ramo no se reconoce, devuelve 0. Pruébela con una macro ProbarComision. Las tasas son Auto 8%, Vida 12%, Hogar 10% y Salud 9%; cualquier otro ramo no paga comisión. El ramo puede venir con espacios o en mayúsculas.\n2. LlenarComisiones. Con una sola instrucción por columna, poner en F la fórmula =Comision(D2,C2) y en G la comisión con un bono de $25 para las pólizas nuevas. Encabezados \"Comisión\" y \"Comisión con bono\".\n3. EsPrimaAlta(prima): función privada, True si la prima es de 1,000 o más. PintarFila(ws, fila, colorFila): Sub privado que rellena las columnas A a G de una fila. ResaltarPrimasAltas: macro pública que pinta de celeste las pólizas de prima alta, quita el relleno a las demás e imprime cuántas son."},
 {id:"A4", t:"A4 Pedidos", txt:"Cada macro lee la hoja una sola vez con datos = ws.Range(\"A2:F\" & ultima).Value y trabaja con el arreglo.\n1. TotalesPedidos. Calcular el total de cada pedido (unidades × precio, a 2 decimales) en un arreglo y escribir todos los totales de una sola vez en la columna G, con el encabezado \"Total\". Imprimir cuántos pedidos hay y cuánto suman.\n2. ClientesDistintos. Armar una Collection con los clientes sin repetir, en el orden en que aparecen, e imprimir cuántos son y sus nombres.\n3. ResumenPorCategoria. Con un Dictionary, acumular las ventas y el número de pedidos de cada categoría en una sola pasada. Crear al final del libro la hoja \"A4 Resumen\"; si ya existe de una ejecución anterior, se elimina sin preguntar. La tabla lleva Categoría, Pedidos, Ventas y % del total, una fila Total en negrita y formatos de número y porcentaje. Al final, un MsgBox con la categoría que más vendió. Las categorías no se escriben en el código."}

<script>
/* Fase 4: Índice de errores y checklist.
   tipo: "comp" = de compilación (VBA no deja correr), "run" = en ejecución (con número),
         "mudo" = sin mensaje, pero el resultado sale mal.
   msg = el texto tal como lo muestra Excel en inglés; es = qué quiere decir.
   causas / arreglo = listas; fn = fichas relacionadas. */

<script>
/* Motor del kit: no toca la página, solo transforma texto.
   Lo usa app.js en el navegador y construir.py (vía node) para generar los .bas. */
(function (raiz) {
"use strict";

/* "C" -> 3, "AA" -> 27 */
function colNum(letras) {
  var s = String(letras || "").toUpperCase().replace(/[^A-Z]/g, "");
  var n = 0;
  for (var i = 0; i < s.length; i++) n = n * 26 + (s.charCodeAt(i) - 64);
  return n;
}

/* Valor final de un parámetro, ya listo para pegar en el código */
function valorDe(p, crudo) {
  var v = (crudo === undefined || crudo === null || String(crudo).trim() === "") ? p.v : String(crudo);
  if (p.t === "col") { v = v.toUpperCase().replace(/[^A-Z]/g, "") || p.v; return { txt: v, num: String(colNum(v)) }; }
  if (p.t === "num") { v = v.replace(",", ".").replace(/[^0-9.\-]/g, "") || p.v; return { txt: v }; }
  if (p.t === "low") { v = v.trim().toLowerCase(); }
  return { txt: v.replace(/"/g, '""') };
}

/* Posición del primer ' que está fuera de comillas (o -1) */
function inicioComentario(linea) {
  var dentro = false;
  for (var i = 0; i < linea.length; i++) {
    var c = linea[i];
    if (c === '"') dentro = !dentro;
    else if (c === "'" && !dentro) return i;
  }
  return -1;
}

/* Separa una línea de plantilla en código, comentario corto/largo y trampa */
function partir(linea) {
  var r = { codigo: linea, c1: "", c2: "", trampa: "", soloComentario: 0 };
  var t = linea.trim();
  var m = /^'([12]) (.*)$/.exec(t);
  if (m) { r.soloComentario = Number(m[1]); r.codigo = linea.slice(0, linea.indexOf("'")); r.c1 = m[2]; return r; }
  var pos = inicioComentario(linea);
  if (pos < 0) return r;
  var resto = linea.slice(pos);
  if (!/^'[12!] /.test(resto)) return r;          /* comentario normal: se deja tal cual */
  r.codigo = linea.slice(0, pos).replace(/\s+$/, "");
  var trozos = resto.split(/(?:^|\s)'([12!]) /);   /* ["", "1", "texto", "!", "texto"] */
  for (var i = 1; i < trozos.length; i += 2) {
    var tipo = trozos[i], txt = (trozos[i + 1] || "").trim();
    if (tipo === "1") r.c1 = txt; else if (tipo === "2") r.c2 = txt; else r.trampa = txt;
  }
  return r;
}

/* Aplica parámetros y nivel. nivel: 0 sin comentarios, 1 cortos, 2 completos.
   Devuelve { texto, lineas: [{ t, cambiar:[claves], trampa }] } */
function procesar(plantilla, params, valores, nivel) {
  var mapa = {};
  (params || []).forEach(function (p) { mapa[p.k] = p; });
  var salida = [];
  plantilla.split("\n").forEach(function (cruda) {
    var claves = [];

function resaltar(linea, fn) {

      if (j < 0) j = codigo.length - 1;

      var cls = (!punto && ES_CLAVE[low]) ? "k" : (clave ? "f" : "");

function norm(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
var indice = [];
function armarIndice() {
  indice = [];

  });

    });

var resActuales = [], resSel = 0;
function buscar(q) {
  var caja = $("#resultados"), nq = norm(q).trim();
  if (!nq) { caja.hidden = true; return; }
  var vacias = ["de","la","el","en","y","a","que","por","con","los","las","del","un","una","al","se","o"];
  var palabras = nq.split(/\s+/).filter(function (w) { return w && vacias.indexOf(w) < 0; });
  if (!palabras.length) palabras = [nq];
  resActuales = indice.map(function (x) {
    var hits = 0, pts = 0, tn = norm(x.t);
    palabras.forEach(function (w) {
      if (x.s.indexOf(w) >= 0) { hits++; pts++; }
      if (tn === w) pts += 10; else if (tn.indexOf(w) === 0) pts += 3;
    });
    return { x: x, hits: hits, pts: pts };
  }).filter(function (r) { return r.hits === palabras.length; })
    .sort(function (a, b) { return b.pts - a.pts; }).slice(0, 16).map(function (r) { return r.x; });
  /* agrupar respetando el orden del mejor resultado de cada grupo */
  var grupos = [];
  resActuales.forEach(function (x) { if (grupos.indexOf(x.g) < 0) grupos.push(x.g); });
  resActuales.sort(function (a, b) { return grupos.indexOf(a.g) - grupos.indexOf(b.g); });
  resSel = 0;
  if (!resActuales.length) {
    caja.innerHTML = '<div class="res-vacio">Nada con “' + esc(q) + '”. Probá con el nombre de la función (Mid, Weekday) o una palabra del enunciado (fin de semana, sin repetir).</div>';
  } else {
    var h = "", g = "";
    resActuales.forEach(function (x, i) {
      if (x.g !== g) { g = x.g; h += '<div class="res-grupo">' + g + "</div>"; }
      h += '<button type="button" class="res' + (i === 0 ? " sel" : "") + '" data-res="' + i + '"><b>' + esc(x.t) + "</b><span>" + esc(x.d) + "</span></button>";
    });
    caja.innerHTML = h;
  }
  caja.hidden = false;
}

/* Texto normalizado con el mapa de posiciones al original (para marcar frases) */
function normConMapa(txt) {
  var n = "", mapa = [];
  for (var i = 0; i < txt.length; i++) {
    var c = txt[i].normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    for (var j = 0; j < c.length; j++) { n += c[j]; mapa.push(i); }
  }
  mapa.push(txt.length);
  return { n: n, mapa: mapa };
}
function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

function analizar(txt) {
  var nm = normConMapa(txt), hits = [], rangos = [];
  FR.forEach(function (x, orden) {
    var primera = -1, frase = "";
    x.fr.forEach(function (f) {
      var re = new RegExp("(^|[^a-z0-9])(" + escRe(norm(f)) + ")(?=$|[^a-z0-9])", "g"), m;
      while ((m = re.exec(nm.n))) {
        var ini = m.index + m[1].length, fin = ini + m[2].length;
        rangos.push({ a: nm.mapa[ini], b: nm.mapa[fin], id: x.id });
        if (primera < 0 || ini < primera) { primera = ini; frase = txt.slice(nm.mapa[ini], nm.mapa[fin]); }
        if (m[2].length === 0) re.lastIndex++;
      }
    });
    if (primera >= 0) hits.push({ x: x, pos: primera, frase: frase, orden: orden });
  });
  var ordenCat = CATS.map(function (c) { return c[0]; });
  hits.sort(function (a, b) {
    return (fueraDelControl(a.x.src) - fueraDelControl(b.x.src)) || (ordenCat.indexOf(a.x.cat) - ordenCat.indexOf(b.x.cat)) || (a.orden - b.orden);
  });

  var macros = [];
  (txt.match(/\b[A-Z][a-z0-9]+(?:[A-Z][a-z0-9]*)+\b/g) || []).forEach(function (w) {
    if (SIN_CAMEL.indexOf(w) >= 0 || FN[w.toLowerCase()] || macros.indexOf(w) >= 0) return;
    macros.push(w);
  });
  var reNom = /\b(?:Funci[oó]n|funci[oó]n|macro|Sub)\s+([A-Z][A-Za-z0-9]+)/g, mn;
  while ((mn = reNom.exec(txt))) {
    var w2 = mn[1];
    if (SIN_CAMEL.indexOf(w2) < 0 && !FN[w2.toLowerCase()] && macros.indexOf(w2) < 0) macros.push(w2);
  }
  var textos = [];
  (txt.match(/["“]([^"”\n]{1,40})["”]/g) || []).forEach(function (q) {
    var t = q.slice(1, -1).trim();
    if (t && !/^=/.test(t) && !/^[A-Z]{1,3}\d*:[A-Z]{1,3}\d*$/.test(t) && textos.indexOf(t) < 0) textos.push(t);
  });
  var cols = [];
  var reCol = /\b(?:columnas?|En)\s+([A-Z]{1,2})\b(?:\s+(?:a|y)\s+([A-Z]{1,2})\b)?/g, mc;
  while ((mc = reCol.exec(txt))) { var c = mc[1] + (mc[2] ? " a " + mc[2] : ""); if (cols.indexOf(c) < 0) cols.push(c); }

  var votos = {};
  hits.forEach(function (hh) { if (hh.x.ver) { var pid = hh.x.ver.split(":")[0]; votos[pid] = (votos[pid] || 0) + 1; } });
  P.forEach(function (p) { p.macros.forEach(function (m) { if (macros.indexOf(m.n) >= 0) votos[p.id] = (votos[p.id] || 0) + 5; }); });
  var parecido = Object.keys(votos).sort(function (a, b) { return votos[b] - votos[a]; })[0];

  return { hits: hits, rangos: rangos, macros: macros, textos: textos, cols: cols, parecido: parecido };
}

function textoMarcado(txt, rangos) {
  rangos.sort(function (a, b) { return a.a - b.a || b.b - a.b; });
  var h = "", pos = 0;
  rangos.forEach(function (r) {
    if (r.a < pos) return;
    h += esc(txt.slice(pos, r.a)) + '<mark data-ir-frase="' + r.id + '" title="Ver la pieza">' + esc(txt.slice(r.a, r.b)) + "</mark>";
    pos = r.b;
  });
  return h + esc(txt.slice(pos));
}
